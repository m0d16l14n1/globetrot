# /etc/globetrot.conf — Dual-Role Fn / Globe Key Configuration for Linux
#
# Behavior summary:
#   - Quick solo tap (<= tap_timeout_ms, no other key/click/scroll) -> tap action
#   - Hold > tap_timeout_ms and release alone -> debounced (no accidental switch)
#   - Fn + F1..F12 / Arrows / Backspace / Return -> pure kernel Fn-layer passthrough
#   - Fn + any key -> explicit [bindings] or optional combo_modifier for DE shortcuts

[globe]
# Physical trigger key (keyboards with host-visible Fn emit KEY_FN = 464).
globe_keycode = fn

# Solo Globe tap behavior:
#   layout   - instant MRU keyboard layout switch via globetrot-session
#              (supports KDE/KWin, Hyprland, Niri, Sway, GNOME, fcitx5)
#   key      - emit tap_key (X11/Wayland/XKB-safe, default f24) so any compositor
#              or app can bind the Globe button as a regular shortcut key
#   both     - trigger MRU layout switch AND emit tap_key
#   emoji    - open desktop emoji picker
#   command  - run tap_command in user session
#   disabled - Fn acts strictly as a modifier/combo key
tap_mode = layout

# Solo-tap debounce ceiling in milliseconds (default: 400 ms, allowed: 50..2000).
# Holding longer than this without pressing another key suppresses the tap.
tap_timeout_ms = 400

# Synthetic key or chord emitted when tap_mode = key or both.
# Examples: f24, leftmeta+space, leftalt+leftshift, iso, compose
tap_key = f24

# Command executed in user session when tap_mode = command.
# tap_command = notify-send "Globe tapped"

# Optional double-tap action (disabled by default for 0 ms single-tap latency).
# Modes: disabled | layout | key | emoji | command
# Avoid f21/f22/f23 for any Globe output: stock XKB maps them to touchpad toggle/on/off.
double_tap_mode = disabled
double_tap_window_ms = 350
# double_tap_key = f19
# double_tap_command = ...

# Universal modifier emitted when Globe is held with an UNBOUND non-Fn-layer key
# (e.g. Globe + C, Globe + A, Globe + 1). Kernel Fn-layer outputs (Delete, Insert,
# Home, End, PageUp, PageDown, F1..F12, Brightness, Volume, Media) always stay pure.
#
# Presets:
#   none           - do not inject an extra modifier (use explicit [bindings] below)
#   super_alt      - Super+Alt (bindable natively in KDE, Hyprland, Niri, GNOME)
#   ctrl_alt_super - Ctrl+Alt+Super
#   hyper          - KEY_F18 (pair with /usr/share/doc/globetrot/globetrot-hyper.txt
#                    for a Mod3/Hyper modifier)
#   hyper_chord    - Ctrl+Alt+Super+Shift
#   rightalt       - AltGr / ISO_Level3_Shift
combo_modifier = none

# Forward raw KEY_FN (464) to uinput? Keep false so XKB/apps never see stray Fn events.
pass_fn_raw = false

# Bilingual typing rollover tolerance: releasing a key that was pressed BEFORE Globe
# went down does not cancel the solo tap. Set false for strict rollover cancellation.
rollover_safe = true

# Cancel the pending solo tap on a physical mouse/trackpad button press or mouse-wheel
# scroll while Globe is held. (Two-finger trackpad scrolling and tap-to-click happen in
# libinput, above evdev, and are not seen here.)
cancel_on_pointer = true

[bindings]
# Custom Globe + [mods+] <key> bindings.
# The kernel turns Fn+Backspace/Return/arrows into delete/insert/home/end/pageup/
# pagedown before this daemon sees them, so bind those names, not the base keys.
# Targets:
#   key:<chord>      - remap held key directly in uinput (zero latency, repeat-safe)
#   action:<name>    - built-in session action: switch_layout | prev_layout | emoji
#   exec:<command>   - run command inside the graphical user session
#
# Examples (uncomment to enable):
# globe+e = action:emoji
# globe+f = key:f11
# globe+h = key:leftmeta+d
# globe+n = key:leftmeta+v
# globe+space = action:switch_layout
# globe+shift+space = action:prev_layout
# globe+ctrl+home = key:leftmeta+left
# globe+ctrl+end = key:leftmeta+right

[session]
# Desktop layout backend: auto | kwin | hyprland | niri | sway | gnome | fcitx5
backend = auto

# MRU layout cycling commit window in milliseconds (default: 1000 ms).
# With 3+ layouts: tapping Globe toggles the 2 most recent layouts; tapping again
# within 1000 ms cycles to the 3rd/4th layout before committing on timeout.
mru_commit_ms = 1000

# Optional emoji picker command override (auto-detects plasma-emojier / rofimoji / etc.)
# emoji_command = plasma-emojier
